<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Servers carry signed traffic; identity stays with the DID document" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #9198a1; }
    .box { fill: none; stroke: #9198a1; stroke-width: 1.25; }
    .accent { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .head { fill: #9198a1; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge, .box { stroke: #656c76; }
      .head { fill: #656c76; }
      .accent { fill: #4493f8; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="30" font-size="15" font-weight="600">Servers carry signed traffic; identity stays with the DID document</text>
  <text class="quiet" x="24" y="54" font-size="11.5">Discovery, in authority order</text>

  <rect class="accent" x="24" y="64" width="216" height="56" rx="8"/>
  <text class="ink" x="132" y="88" text-anchor="middle" font-weight="600">1  DID document</text>
  <text class="ink" x="132" y="104" text-anchor="middle" font-size="11.5">authority for keys and relay</text>

  <rect class="box" x="272" y="64" width="216" height="56" rx="8"/>
  <text class="ink" x="380" y="88" text-anchor="middle" font-weight="600">2  Alias provider + log</text>
  <text class="quiet" x="380" y="104" text-anchor="middle" font-size="11.5">alias to DID, checked on a log</text>

  <rect class="box" x="520" y="64" width="216" height="56" rx="8"/>
  <text class="ink" x="628" y="88" text-anchor="middle" font-weight="600">3  DHT hints nodes</text>
  <text class="quiet" x="628" y="104" text-anchor="middle" font-size="11.5">signed hints, never authority</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M104 176V120" marker-end="url(#arrow)"/>
    <path d="M184 212H288" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M472 212H576" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M184 274H576" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M184 324H208" marker-end="url(#arrow)"/>
    <path d="M368 324H400" marker-end="url(#arrow)"/>
    <path d="M544 324H576" marker-end="url(#arrow)"/>
  </g>
  <text class="quiet" x="112" y="152" font-size="11.5">resolve Bob</text>

  <rect class="box" x="24" y="176" width="160" height="176" rx="8"/>
  <text class="ink" x="104" y="200" text-anchor="middle" font-weight="600">Alice's devices</text>
  <text class="quiet" x="104" y="216" text-anchor="middle" font-size="11.5">phone, laptop, browser</text>
  <text class="quiet" x="104" y="232" text-anchor="middle" font-size="11.5">each with a delegation</text>

  <rect class="box" x="288" y="176" width="184" height="72" rx="8"/>
  <text class="ink" x="380" y="200" text-anchor="middle" font-weight="600">Relay</text>
  <text class="quiet" x="380" y="216" text-anchor="middle" font-size="11.5">routes and forks invites</text>
  <text class="quiet" x="380" y="232" text-anchor="middle" font-size="11.5">holds for offline devices</text>

  <rect class="box" x="576" y="176" width="160" height="176" rx="8"/>
  <text class="ink" x="656" y="200" text-anchor="middle" font-weight="600">Bob's devices</text>
  <text class="quiet" x="656" y="216" text-anchor="middle" font-size="11.5">every device rings</text>
  <text class="quiet" x="656" y="232" text-anchor="middle" font-size="11.5">first answer wins</text>

  <text class="quiet" x="236" y="204" text-anchor="middle" font-size="11.5">signed invite</text>
  <text class="quiet" x="524" y="204" text-anchor="middle" font-size="11.5">to each device</text>
  <text class="quiet" x="380" y="267" text-anchor="middle" font-size="11.5">media after the signed answer: direct or via TURN</text>

  <rect class="box" x="208" y="296" width="160" height="56" rx="8"/>
  <text class="ink" x="288" y="320" text-anchor="middle" font-weight="600">Alice's mailbox</text>
  <text class="quiet" x="288" y="336" text-anchor="middle" font-size="11.5">hub: orders, fans out</text>

  <rect class="box" x="400" y="296" width="144" height="56" rx="8"/>
  <text class="ink" x="472" y="320" text-anchor="middle" font-weight="600">Bob's mailbox</text>
  <text class="quiet" x="472" y="336" text-anchor="middle" font-size="11.5">pushes or holds</text>

  <text class="quiet" x="380" y="376" text-anchor="middle" font-size="11.5">messages: MLS-encrypted, deposited at mailboxes</text>
</svg>
