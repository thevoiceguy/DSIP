name: fuzz

# Differential fuzzing with a fresh seed and a larger count than ci.yml's two seeds. A failure here is a finding,
# not a regression — reproduce with the seed it prints, shrink, and turn it into a hand-authored vector or a spec-gap.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: "seed (integer, or `random`)"
        default: "random"
      count:
        description: "probes per target"
        default: "2000"

# `shell: bash` makes GitHub run steps with `-eo pipefail`. Without it a step like `bash demos/x.sh | tail -20` takes
# tail's exit status, and a failing demo passes CI — which is how a broken revocation demo got through PR #38.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: random-seed differential fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pynacl cryptography
      - name: Rust, as pinned in impl/rust-toolchain.toml
        # installs the channel, components and targets the file names, and makes it the default for steps that
        # run cargo from outside impl/
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)" && rustc --version
        working-directory: impl
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: impl }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cargo build -p dsip-cli
        working-directory: impl
      - run: npm ci && npm run build
        working-directory: impl-ts
      - run: python3 impl/tools/fuzz.py --seed "${{ inputs.seed || 'random' }}" --count "${{ inputs.count || '2000' }}" --out found
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-reproducers, path: found }
