name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# `shell: bash` makes GitHub run steps with `-eo pipefail`. Without it a step like `bash demos/x.sh | tail -20` takes
# tail's exit status, and a failing demo passes CI — which is how a broken revocation demo got through PR #38.
defaults:
  run:
    shell: bash

# The runner image's CMake 4 refuses projects declaring cmake_minimum_required < 3.5, which the Opus source vendored
# by audiopus_sys does; this lets it configure (ubuntu-latest moved to 26.04 on 2026-10-19).
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  schemas:
    name: schemas are fresh + sample harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - name: regenerate schemas and diff
        run: |
          python3 v1.0/dsip-schemas-v1.0/dsip-schemas/generate_schemas.py v1.0/dsip-schemas-v1.0/dsip-schemas/schemas
          git diff --exit-code -- v1.0/dsip-schemas-v1.0/dsip-schemas/schemas
      - run: python3 v1.0/dsip-schemas-v1.0/dsip-schemas/validate_samples.py
      - name: regenerate Messaging Profile schemas (v0.17) and diff
        run: |
          python3 v1.0/dsip-messaging-schemas-draft/generate_schemas.py v1.0/dsip-messaging-schemas-draft/schemas
          git diff --exit-code -- v1.0/dsip-messaging-schemas-draft/schemas

  vectors:
    name: vectors regenerate cleanly + Python harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pynacl cryptography
      - name: vectors are deterministic and committed
        run: |
          python3 impl/tools/generate_vectors.py
          git diff --exit-code -- impl/vectors
      - run: python3 impl/tools/run_vectors.py

  rust:
    name: the Rust implementation (dsip-rs at impl/dsip-rs.rev) — its vector runner, parity, spec lint, fuzz, DHT testnet
    runs-on: ubuntu-latest
    # The crates are built against this checkout's spec and vectors, not their spec/ submodule (impl/tools/dsip_rs.py):
    # what is measured is the pinned dsip-rs commit on the vectors of this commit.
    env:
      DSIP_SPEC: ${{ github.workspace }}
      DSIP_VECTORS: ${{ github.workspace }}/impl/vectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pynacl cryptography
      - name: dsip-rs, at the commit pinned in impl/dsip-rs.rev
        run: impl/tools/dsip-rs.sh
      - name: Rust, as pinned in dsip-rs's rust-toolchain.toml
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)" && rustc --version
        working-directory: dsip-rs
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: dsip-rs }
      - run: cargo build -p dsip-cli -p dsip-dht
        working-directory: dsip-rs
      - name: the Rust vector runner
        run: cargo run -q -p dsip-cli -- vectors run
        working-directory: dsip-rs
      - name: Rust/Python parity
        run: python3 impl/tools/parity.py
      - name: every Rust module cites the spec (a `Spec` line in each module header)
        run: python3 impl/tools/spec_lint.py --check
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: differential fuzz — Python, Rust and TypeScript on generated traces (fixed seed, then this run's own)
        # Seed 1 is the regression seed every checkout reproduces. The run number is a second seed no earlier run
        # used, so every push probes new traces; it is printed and reproducible (`--seed N`). Seeds 3–6 at 1,500
        # probes found seven divergences (spec-gaps 87–93) that seed 1 at 150 never could.
        run: |
          (cd impl-ts && npm ci && npm run build)
          python3 impl/tools/fuzz.py --seed 1 --count 150
          python3 impl/tools/fuzz.py --seed "${{ github.run_number }}" --count 800 --out found
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-reproducers, path: found, if-no-files-found: ignore }
      - name: DHT local testnet (5 nodes)
        run: python3 impl/tools/dht_testnet.py --nodes 5 --report /tmp/dht-report.json

  typescript:
    name: second implementation (impl-ts) passes the vectors + Python/TypeScript parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pynacl cryptography
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci && npm run build
        working-directory: impl-ts
      - run: npm run vectors
        working-directory: impl-ts
      - run: python3 impl/tools/parity_ts.py --require-all
